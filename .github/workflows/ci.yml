name: CI

on:
  # A push to a PR branch already gets a pull_request run, so pushes are only
  # interesting for the trunk itself; without this filter every PR commit ran
  # the long-running jobs twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The gates share only their setup and run as independent matrix jobs so a
    # PR waits for the slowest gate rather than their sum.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit and lowering specs
            command: npm run test:unit
            acceptance: false
          - name: Clean generation and audit
            command: npm run test:current
            acceptance: false
          - name: ROM-backed accepted contracts
            command: npm run test:games:ci
            acceptance: true
    env:
      MAME_SRC: ${{ github.workspace }}/.mame
    steps:
      - name: Check out MAMEKIT
        uses: actions/checkout@v6

      - name: Check out pinned MAME source
        uses: actions/checkout@v6
        with:
          repository: mamedev/mame
          ref: f34f02505e32c1993c6a782b6814232cbfc74e36
          path: .mame
          sparse-checkout: |
            src
            hash/nes.xml
            hash/gameboy.xml
            3rdparty/ymfm/src
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ${{ matrix.name }}
        # Colocated specs are independent processes with no shared state, so
        # they fan out across the runner's cores; the sequential loop spent
        # most of its time idle behind six slow lowering specs.
        env:
          SPEC_JOBS: 4
        run: ${{ matrix.command }}

      - name: Upload complete acceptance report
        if: always() && matrix.acceptance
        uses: actions/upload-artifact@v4
        with:
          name: rom-acceptance-report
          path: .cache/acceptance-report.json
          if-no-files-found: warn
