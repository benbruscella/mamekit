name: CI

on:
  # A push to a PR branch already gets a pull_request run, so pushes are only
  # interesting for the trunk itself; without this filter every PR commit ran
  # the long-running jobs twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and lowering specs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAME_SRC: ${{ github.workspace }}/.mame
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out MAMEKIT
        uses: actions/checkout@v6

      - name: Check out pinned MAME source
        uses: actions/checkout@v6
        with:
          repository: mamedev/mame
          ref: f34f02505e32c1993c6a782b6814232cbfc74e36
          path: .mame
          sparse-checkout: |
            src
            hash/nes.xml
            hash/gameboy.xml
            3rdparty/ymfm/src
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and lowering specs
        # Colocated specs are independent processes with no shared state, so
        # they fan out across the runner's cores; the sequential loop spent
        # most of its time idle behind six slow lowering specs.
        env:
          SPEC_JOBS: 4
        run: npm run test:unit

  generate:
    # The distribution is generated once for the whole run and handed to the
    # ROM-backed shards. Generating it per shard cost four extra clean
    # generations, and had each shard testing a distribution no other job saw.
    name: Clean generation and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAME_SRC: ${{ github.workspace }}/.mame
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out MAMEKIT
        uses: actions/checkout@v6

      - name: Check out pinned MAME source
        uses: actions/checkout@v6
        with:
          repository: mamedev/mame
          ref: f34f02505e32c1993c6a782b6814232cbfc74e36
          path: .mame
          sparse-checkout: |
            src
            hash/nes.xml
            hash/gameboy.xml
            3rdparty/ymfm/src
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean generation and audit
        run: npm run test:current

      - name: Upload the generated distribution
        uses: actions/upload-artifact@v4
        with:
          name: generated-dist
          path: dist
          # Only the ROM-backed shards in this same run consume it.
          retention-days: 1
          # dist is generated JS and JSON; the default level pays for itself in
          # download time across four shards.
          compression-level: 6

  acceptance:
    # Real-ROM contracts are split across runners rather than run as one
    # half-hour job. The split has to be across machines: every contract
    # asserts an emulated-fps floor measured against wall clock, so contracts
    # sharing a runner's cores would drag each other under their floors and
    # fail for load rather than for behaviour.
    name: ROM-backed accepted contracts ${{ matrix.shard }}/8
    # CPS1 clears the exact 50 fps contract comfortably on the target arm64
    # architecture; the x64 hosted VM measured 45.1-49.4 fps. Keep the contract
    # strict by selecting capacity, not lowering it.
    runs-on: macos-15
    timeout-minutes: 45
    needs: generate
    strategy:
      fail-fast: false
      matrix:
        # Keep SHARDS equal to the number of entries here. Eight is chosen
        # against measured contract durations: the phase is ~9.7 min over four
        # runners and ~5.6 over eight, and a shard's own fixed cost is only 22
        # seconds (the generated distribution downloads in three), so extra
        # runners are nearly free. Past eight the 92-second mslug contract
        # starts to set the floor on its own.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # No MAME_SRC: the contracts run the generated distribution and never
      # read MAME source, which is why this job does not check it out.
      NODE_OPTIONS: --max-old-space-size=4096
      SHARDS: 8
    steps:
      - name: Check out MAMEKIT
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the generated distribution
        uses: actions/download-artifact@v4
        with:
          name: generated-dist
          path: dist

      - name: Fetch acceptance ROMs
        run: npm run fetch:acceptance-roms

      - name: Accepted contracts ${{ matrix.shard }}/8
        run: npm run test:games:matrix -- --shard ${{ matrix.shard }}/${{ env.SHARDS }}

      - name: Upload complete acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Artifact names must be unique across a run, so each shard keeps its
          # own report rather than the last writer winning.
          name: rom-acceptance-report-${{ matrix.shard }}
          path: .cache/acceptance-report.json
          if-no-files-found: warn

  acceptance-gate:
    # Branch protection requires a check with this exact name. Sharding the
    # work renamed the jobs that do it, so this job aggregates them and keeps
    # the required check stable: it passes only when every shard passed, and a
    # shard that fails, is cancelled or never runs fails it too.
    name: ROM-backed accepted contracts
    runs-on: ubuntu-latest
    needs: acceptance
    if: always()
    steps:
      - name: Every shard passed
        run: |
          echo "shards reported: ${{ needs.acceptance.result }}"
          test "${{ needs.acceptance.result }}" = "success"
