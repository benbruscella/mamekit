name: CI

on:
  # A push to a PR branch already gets a pull_request run, so pushes are only
  # interesting for the trunk itself; without this filter every PR commit ran
  # the 45-minute job twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The two gates share only their setup: colocated specs never read the
    # generated tree, and generation never runs a spec. Running them as one job
    # made every PR wait for their sum rather than the longer of the two.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit and lowering specs
            command: npm run test:unit
          - name: Clean generation and audit
            command: npm run test:current
    env:
      MAME_SRC: ${{ github.workspace }}/.mame
    steps:
      - name: Check out MAMEKIT
        uses: actions/checkout@v6

      - name: Check out pinned MAME source
        uses: actions/checkout@v6
        with:
          repository: mamedev/mame
          ref: b8f3d94f9904e1068d6b44fa6b3915e4bf90fd83
          path: .mame
          sparse-checkout: |
            src
            hash/nes.xml
            hash/gameboy.xml
            3rdparty/ymfm/src
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ${{ matrix.name }}
        # Colocated specs are independent processes with no shared state, so
        # they fan out across the runner's cores; the sequential loop spent
        # most of its time idle behind six slow lowering specs.
        env:
          SPEC_JOBS: 4
        run: ${{ matrix.command }}
